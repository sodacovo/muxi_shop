[uwsgi]
env = DJANGO_SETTINGS_MODULE=muxi_shop_api2.settings.settings_dev

home = /www/wwwroot/muxi_django/venv
pythonpath = /www/wwwroot/muxi_django
master = true
processes = 1
threads = 2
chdir = /www/wwwroot/muxi_django
module = muxi_shop_api2.wsgi:application
http = 0.0.0.0:8000

# 👇 新增以下3行（适配单进程双线程，避免线程间重复导入）
lazy-apps = true        # 延迟加载应用，线程独立初始化
single-interpreter = true  # 单个Python解释器，避免线程间资源冲突
enable-threads = true   # 确保线程支持（你的配置已有threads=2，这行增强兼容性）

# 日志与 pid
; daemonize = /www/wwwroot/muxi_django/logs/uwsgi.log
pidfile = /www/wwwroot/muxi_django/uwsgi.pid
logto = /www/wwwroot/muxi_django/logs/uwsgi.log
vacuum = true
max-requests = 1000
uid = root
gid = root
